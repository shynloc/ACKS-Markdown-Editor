name: Bug report
description: Report a reproducible problem in ACKS Markdown Editor
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove private documents, credentials and personal data before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: How did you open the editor?
      options:
        - Production HTTPS site
        - Localhost
        - file://
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Safari 19 / iOS 19, Chrome 140 / macOS 16, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal document with private content removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, tokens, private documents and personal data.
          required: true
