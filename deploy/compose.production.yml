services:
  web:
    image: ${IMAGE_TAG:?set IMAGE_TAG}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
        VCS_REF: ${VCS_REF:-unknown}
    container_name: acks-markdown-editor
    restart: unless-stopped
    read_only: true
    user: "101:101"
    ports:
      - "127.0.0.1:${APP_PORT:-5703}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - private

networks:
  private:
    # Public access still enters through the loopback-only published port and Caddy.
    # An internal-only Docker network would also block the host's published-port NAT.
    driver: bridge
